[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kautilya"
version = "0.1.0"
description = "Time-aware, citation-verified, multilingual legal RAG over Indian law"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "indictranstoolkit>=1.1",
    "streamlit>=1.30",
    "polars>=1.44",
    "pymupdf>=1.28",
    "bm25s>=0.3.11",
    "langgraph>=1.2",
    "lancedb>=0.37",
    "sentence-transformers>=6.0",
    "torch>=2.13",
    "textstat>=0.7.13",
    "google-genai>=2.20",
    "transformers>=4.45",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
kautilya = "kautilya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
